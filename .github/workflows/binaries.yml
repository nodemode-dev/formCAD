name: binaries

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Which program to build
        type: choice
        options: [kernel, mesher]
        default: kernel
      release:
        description: Release number, for example 8.0.1 or 8.0.1-2 (kernel), 6.2.2608 (mesher)
        required: true
      publish:
        description: Create a draft release in nodemode-dev/formai-binaries
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: binaries-${{ inputs.kind }}-${{ inputs.release }}
  cancel-in-progress: false

env:
  KIND: ${{ inputs.kind }}
  RELEASE: ${{ inputs.release }}
  SOURCE_DATE_EPOCH: '315532800'

jobs:
  credentials:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: A publishing run has every credential before anything is built
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.BINARIES_REPO_TOKEN }}
          HAVE: >-
            APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
            APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE != '' }}
            APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
            APPLE_API_KEY=${{ secrets.APPLE_API_KEY != '' }}
            APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER != '' }}
            APPLE_API_PRIVATE_KEY=${{ secrets.APPLE_API_PRIVATE_KEY != '' }}
            BINARIES_REPO_TOKEN=${{ secrets.BINARIES_REPO_TOKEN != '' }}
          HAVE_AZURE: >-
            AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID != '' }}
            AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID != '' }}
            AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET != '' }}
            ARTIFACT_SIGNING_ENDPOINT=${{ vars.ARTIFACT_SIGNING_ENDPOINT != '' || secrets.ARTIFACT_SIGNING_ENDPOINT != '' }}
            ARTIFACT_SIGNING_ACCOUNT=${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' || secrets.ARTIFACT_SIGNING_ACCOUNT != '' }}
            ARTIFACT_SIGNING_PROFILE=${{ vars.ARTIFACT_SIGNING_PROFILE != '' || secrets.ARTIFACT_SIGNING_PROFILE != '' }}
          HAVE_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        run: |
          missing=""
          for pair in $HAVE; do [ "${pair#*=}" = true ] || missing="$missing ${pair%%=*}"; done
          if [ "$HAVE_WINDOWS_CERT" != true ]; then
            for pair in $HAVE_AZURE; do [ "${pair#*=}" = true ] || missing="$missing ${pair%%=*}"; done
          fi
          if [ -n "$missing" ]; then
            echo "publish is checked and these are not set for this repository:$missing" >&2
            echo "set them as repository secrets (the three ARTIFACT_SIGNING names may be repository variables); nothing was built" >&2
            exit 1
          fi
          case "$KIND" in kernel) tag="occt-$RELEASE" ;; mesher) tag="mesher-$RELEASE" ;; esac
          if gh release view "$tag" --repo nodemode-dev/formai-binaries >/dev/null 2>&1; then
            echo "tag $tag already exists in formai-binaries; a published tag is never replaced, pick a new release number" >&2
            exit 1
          fi
          probe="probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if ! gh release create "$probe" --repo nodemode-dev/formai-binaries --draft --title "$probe" --notes "write check of formCAD's binaries workflow; safe to delete" >/dev/null; then
            echo "BINARIES_REPO_TOKEN cannot create a release in nodemode-dev/formai-binaries; nothing was built" >&2
            exit 1
          fi
          gh release delete "$probe" --repo nodemode-dev/formai-binaries --yes >/dev/null || echo "::warning::the draft release $probe in formai-binaries could not be deleted; delete it by hand"
          echo "every credential is present and the token can create a release in formai-binaries"
  build:
    needs: credentials
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            os: macos-15
            minimum_os: macOS 15
          - triple: x86_64-apple-darwin
            os: macos-15-intel
            minimum_os: macOS 15
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            minimum_os: glibc 2.35
          - triple: x86_64-pc-windows-msvc
            os: windows-2022
            minimum_os: Windows 10
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TRIPLE: ${{ matrix.triple }}
      HAVE_APPLE_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAVE_APPLE_NOTARY: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_PRIVATE_KEY != '' }}
      HAVE_AZURE_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && (vars.ARTIFACT_SIGNING_ACCOUNT != '' || secrets.ARTIFACT_SIGNING_ACCOUNT != '') }}
      HAVE_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - name: Refuse to publish without macOS signing credentials
        if: inputs.publish && runner.os == 'macOS' && (env.HAVE_APPLE_SIGNING != 'true' || env.HAVE_APPLE_NOTARY != 'true')
        run: |
          echo "publish needs APPLE_SIGNING_IDENTITY, APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_PRIVATE_KEY; an ad hoc signed archive is not released" >&2
          exit 1
      - name: Refuse to publish without Windows signing credentials
        if: inputs.publish && runner.os == 'Windows' && env.HAVE_AZURE_SIGNING != 'true' && env.HAVE_WINDOWS_CERT != 'true'
        run: |
          echo "publish needs the Azure Artifact Signing values or WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD; an unsigned archive is not released" >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and freeze the program
        run: |
          python -m venv "$KIND/venv"
          FORMCAD_LOCKED=1 setup/install_${KIND}
          setup/freeze_${KIND}
      - name: Stage the archive folder
        run: |
          case "$KIND" in kernel) tag=occt; prog=formcad-kernel ;; mesher) tag=mesher; prog=formcad-mesher ;; esac
          folder="$tag-lgpl-$RELEASE-$TRIPLE"
          mkdir -p "$RUNNER_TEMP/stage" "$RUNNER_TEMP/out"
          cp -a "$KIND/dist/$prog" "$RUNNER_TEMP/stage/$folder"
          echo "FOLDER=$folder" >> "$GITHUB_ENV"
      - name: Sign macOS Mach-O files
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi
          release/sign/macos_sign.sh sign "$RUNNER_TEMP/stage/$FOLDER"
      - name: Notarize the signed files
        if: runner.os == 'macOS' && env.HAVE_APPLE_NOTARY == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: release/sign/macos_sign.sh notarize-folder "$RUNNER_TEMP/stage/$FOLDER"
      - name: Sign Windows files with Azure Artifact Signing
        if: runner.os == 'Windows' && env.HAVE_AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT || secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT || secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE || secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ runner.temp }}/stage/${{ env.FOLDER }}
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: formCAD worker
      - name: Sign Windows files with a certificate file
        if: runner.os == 'Windows' && env.HAVE_AZURE_SIGNING != 'true' && env.HAVE_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: release/sign/windows_sign.ps1 -Path "$env:RUNNER_TEMP/stage/$env:FOLDER"
      - name: No Windows program file was left unsigned
        if: runner.os == 'Windows' && (env.HAVE_AZURE_SIGNING == 'true' || env.HAVE_WINDOWS_CERT == 'true')
        shell: pwsh
        run: |
          $files = Get-ChildItem "$env:RUNNER_TEMP/stage/$env:FOLDER" -Recurse -File | Where-Object { $_.Extension -in ".exe", ".dll", ".pyd" }
          $bad = @()
          foreach ($file in $files) {
            $status = (Get-AuthenticodeSignature $file.FullName).Status
            if ($status -in "NotSigned", "HashMismatch") { $bad += "$status $($file.FullName)" }
            elseif ($status -ne "Valid") { Write-Host "::notice::$status $($file.Name)" }
          }
          if ($bad) { $bad | ForEach-Object { Write-Host $_ }; throw "$($bad.Count) of $($files.Count) files are not signed" }
          Write-Host "$($files.Count) files carry a signature"
      - name: The staged program still answers
        run: |
          case "$KIND" in kernel) prog=formcad-kernel ;; mesher) prog=formcad-mesher ;; esac
          [ "$RUNNER_OS" != Windows ] || prog="$prog.exe"
          out="$(printf '{"id":1,"method":"hello","params":{}}\n{"id":2,"method":"shutdown","params":{}}\n' | "$RUNNER_TEMP/stage/$FOLDER/$prog" || true)"
          reply="$(printf '%s\n' "$out" | head -n 1)"
          printf '%s\n' "$reply" | grep -q '"result"' || { echo "the staged program did not answer hello: $reply" >&2; exit 1; }
      - name: Notices, lock, record and archive
        run: |
          T=release/formCAD-binaries/tools
          case "$KIND" in kernel) rec=occt-licence.json ;; mesher) rec=mesher-licence.json ;; esac
          python $T/stage_notices.py --kind "$KIND" --stage "$RUNNER_TEMP/stage/$FOLDER" --release "$RELEASE" --triple "$TRIPLE"
          cp "$KIND/requirements_$KIND.lock" "$RUNNER_TEMP/out/requirements.lock"
          mkdir -p "$RUNNER_TEMP/rec"
          cp "release/formCAD-binaries/records/$rec" "$RUNNER_TEMP/rec/$rec"
          python $T/update_record.py --kind "$KIND" --record "$RUNNER_TEMP/rec/$rec" --triple "$TRIPLE" \
            --stage "$RUNNER_TEMP/stage/$FOLDER" --release "$RELEASE" --lock "$RUNNER_TEMP/out/requirements.lock" \
            --minimum-os "${{ matrix.minimum_os }}" --toolchain "${{ matrix.os }}, PyInstaller 6.22.3, Python 3.12" \
            --verification "hello handshake of the frozen program in setup/freeze_${KIND}"
          python $T/pack_release.py pack --kind "$KIND" --record "$RUNNER_TEMP/rec/$rec" --out "$RUNNER_TEMP/out" \
            --stage-root "$RUNNER_TEMP/stage" --lock "$RUNNER_TEMP/out/requirements.lock"
          cp "$RUNNER_TEMP/rec/$rec" "$RUNNER_TEMP/out/$TRIPLE.record.json"
          rm -f "$RUNNER_TEMP/out/$rec" "$RUNNER_TEMP/out/SHA256SUMS" "$RUNNER_TEMP/out/RELEASE_NOTES.md"
      - name: SBOM of the program (one platform is enough)
        if: matrix.triple == 'x86_64-unknown-linux-gnu'
        run: python release/sbom/formcad_sbom.py --out "$RUNNER_TEMP/out" --component "$KIND" --lock "$RUNNER_TEMP/out/requirements.lock"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kind }}-${{ matrix.triple }}
          path: |
            ${{ runner.temp }}/out/*.tar.gz
            ${{ runner.temp }}/out/*.record.json
            ${{ runner.temp }}/out/*.cdx.json
            ${{ runner.temp }}/out/requirements.lock
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.kind }}-*
          path: parts
          merge-multiple: true
      - name: Merge, check and write the release files
        run: |
          T=release/formCAD-binaries/tools
          case "$KIND" in kernel) rec=occt-licence.json ;; mesher) rec=mesher-licence.json ;; esac
          mkdir -p dist
          mv parts/*.tar.gz parts/*.cdx.json dist/
          python $T/merge_records.py --out "dist/$rec" parts/*.record.json
          cp parts/requirements.lock dist/requirements.lock
          python $T/pack_release.py finalize --kind "$KIND" --record "dist/$rec" --out dist --lock dist/requirements.lock \
            --records-dir release/formCAD-binaries/records --fetch-sources --worker-src $KIND/*.py
          python $T/pack_release.py check --kind "$KIND" --record "dist/$rec" --out dist
          python $T/pack_release.py app-record --kind "$KIND" --record "dist/$rec" --out "dist/app-$rec"
          cp "dist/$rec" "release/formCAD-binaries/records/$rec"
          python $T/preflight.py --records release/formCAD-binaries/records --published --kind "$KIND"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.kind }}-${{ inputs.release }}
          path: dist
          retention-days: 30
      - name: Draft release in formai-binaries
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.BINARIES_REPO_TOKEN }}
        run: |
          case "$KIND" in kernel) tag="occt-$RELEASE" ;; mesher) tag="mesher-$RELEASE" ;; esac
          if gh release view "$tag" --repo nodemode-dev/formai-binaries>/dev/null 2>&1; then
            echo "tag $tag already exists; a published tag is never replaced, pick a new release number" >&2
            exit 1
          fi
          gh release create "$tag" --repo nodemode-dev/formai-binaries --draft --title "$tag" --notes-file dist/RELEASE_NOTES.md dist/*.tar.gz dist/SHA256SUMS dist/requirements.lock dist/*licence.json dist/*.cdx.json
