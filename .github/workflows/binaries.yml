name: binaries

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Which program to build
        type: choice
        options: [kernel, mesher]
        default: kernel
      release:
        description: Release number, for example 8.0.1 or 8.0.1-2 (kernel), 6.2.2608 (mesher)
        required: true
      publish:
        description: Create a draft release in nodemode-dev/formCAD-binaries
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: binaries-${{ inputs.kind }}-${{ inputs.release }}
  cancel-in-progress: false

env:
  KIND: ${{ inputs.kind }}
  RELEASE: ${{ inputs.release }}
  SOURCE_DATE_EPOCH: '315532800'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            os: macos-14
            minimum_os: macOS 14
          - triple: x86_64-apple-darwin
            os: macos-15-intel
            minimum_os: macOS 15
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            minimum_os: glibc 2.35
          - triple: x86_64-pc-windows-msvc
            os: windows-2022
            minimum_os: Windows 10
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      TRIPLE: ${{ matrix.triple }}
      HAVE_APPLE_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_CERTIFICATE != '' }}
      HAVE_APPLE_NOTARY: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY_B64 != '' }}
      HAVE_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' || secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - name: Refuse to publish without macOS signing credentials
        if: inputs.publish && runner.os == 'macOS' && (env.HAVE_APPLE_SIGNING != 'true' || env.HAVE_APPLE_NOTARY != 'true')
        run: |
          echo "publish needs APPLE_SIGNING_IDENTITY, APPLE_CERTIFICATE, APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_KEY_B64; an ad hoc signed archive is not released" >&2
          exit 1
      - name: Refuse to publish without Windows signing credentials
        if: inputs.publish && runner.os == 'Windows' && env.HAVE_WINDOWS_SIGNING != 'true'
        run: |
          echo "publish needs WINDOWS_CERTIFICATE or the Azure artifact signing secrets; an unsigned archive is not released" >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and freeze the program
        run: |
          setup/install_${KIND}
          setup/freeze_${KIND}
      - name: Stage the archive folder
        run: |
          case "$KIND" in kernel) tag=occt; prog=formcad-kernel ;; mesher) tag=mesher; prog=formcad-mesher ;; esac
          folder="$tag-lgpl-$RELEASE-$TRIPLE"
          mkdir -p "$RUNNER_TEMP/stage" "$RUNNER_TEMP/out"
          cp -a "$KIND/dist/$prog" "$RUNNER_TEMP/stage/$folder"
          echo "FOLDER=$folder" >> "$GITHUB_ENV"
      - name: Sign macOS Mach-O files
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          if [ -n "$APPLE_API_KEY_B64" ]; then
            printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi
          release/sign/macos_sign.sh sign "$RUNNER_TEMP/stage/$FOLDER"
      - name: Notarize the signed files
        if: runner.os == 'macOS' && env.HAVE_APPLE_NOTARY == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: release/sign/macos_sign.sh notarize-folder "$RUNNER_TEMP/stage/$FOLDER"
      - name: Sign Windows files
        if: runner.os == 'Windows' && env.HAVE_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: release/sign/windows_sign.ps1 -Path "$env:RUNNER_TEMP/stage/$env:FOLDER"
      - name: Notices, lock, record and archive
        run: |
          T=release/formCAD-binaries/tools
          case "$KIND" in kernel) rec=occt-licence.json ;; mesher) rec=mesher-licence.json ;; esac
          py="$KIND/venv/bin/python"; [ -x "$py" ] || py="$KIND/venv/Scripts/python.exe"
          python $T/stage_notices.py --kind "$KIND" --stage "$RUNNER_TEMP/stage/$FOLDER" --release "$RELEASE" --triple "$TRIPLE"
          "$py" release/sbom/make_lock.py "$RUNNER_TEMP/out/requirements.lock"
          mkdir -p "$RUNNER_TEMP/rec"
          cp "release/formCAD-binaries/records/$rec" "$RUNNER_TEMP/rec/$rec"
          python $T/update_record.py --kind "$KIND" --record "$RUNNER_TEMP/rec/$rec" --triple "$TRIPLE" \
            --stage "$RUNNER_TEMP/stage/$FOLDER" --release "$RELEASE" --lock "$RUNNER_TEMP/out/requirements.lock" \
            --minimum-os "${{ matrix.minimum_os }}" --toolchain "${{ matrix.os }}, PyInstaller 6.22.3, Python 3.12" \
            --verification "hello handshake of the frozen program in setup/freeze_${KIND}"
          python $T/pack_release.py pack --kind "$KIND" --record "$RUNNER_TEMP/rec/$rec" --out "$RUNNER_TEMP/out" \
            --stage-root "$RUNNER_TEMP/stage" --lock "$RUNNER_TEMP/out/requirements.lock"
          cp "$RUNNER_TEMP/rec/$rec" "$RUNNER_TEMP/out/$TRIPLE.record.json"
          rm -f "$RUNNER_TEMP/out/$rec" "$RUNNER_TEMP/out/SHA256SUMS" "$RUNNER_TEMP/out/RELEASE_NOTES.md"
      - name: SBOM of the program (one platform is enough)
        if: matrix.triple == 'x86_64-unknown-linux-gnu'
        run: python release/sbom/formcad_sbom.py --out "$RUNNER_TEMP/out" --component "$KIND" --lock "$RUNNER_TEMP/out/requirements.lock"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kind }}-${{ matrix.triple }}
          path: |
            ${{ runner.temp }}/out/*.tar.gz
            ${{ runner.temp }}/out/*.record.json
            ${{ runner.temp }}/out/*.cdx.json
            ${{ runner.temp }}/out/requirements.lock
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.kind }}-*
          path: parts
          merge-multiple: true
      - name: Merge, check and write the release files
        run: |
          T=release/formCAD-binaries/tools
          case "$KIND" in kernel) rec=occt-licence.json ;; mesher) rec=mesher-licence.json ;; esac
          mkdir -p dist
          mv parts/*.tar.gz parts/*.cdx.json dist/
          python $T/merge_records.py --out "dist/$rec" parts/*.record.json
          cp parts/requirements.lock dist/requirements.lock
          python $T/pack_release.py finalize --kind "$KIND" --record "dist/$rec" --out dist --lock dist/requirements.lock \
            --records-dir release/formCAD-binaries/records --fetch-sources --worker-src $KIND/*.py
          python $T/pack_release.py check --kind "$KIND" --record "dist/$rec" --out dist
          python $T/pack_release.py app-record --kind "$KIND" --record "dist/$rec" --out "dist/app-$rec"
          cp "dist/$rec" "release/formCAD-binaries/records/$rec"
          python $T/preflight.py --records release/formCAD-binaries/records --published
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.kind }}-${{ inputs.release }}
          path: dist
          retention-days: 30
      - name: Draft release in formCAD-binaries
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.BINARIES_REPO_TOKEN }}
        run: |
          case "$KIND" in kernel) tag="occt-$RELEASE" ;; mesher) tag="mesher-$RELEASE" ;; esac
          if gh release view "$tag" --repo nodemode-dev/formCAD-binaries >/dev/null 2>&1; then
            echo "tag $tag already exists; a published tag is never replaced, pick a new release number" >&2
            exit 1
          fi
          gh release create "$tag" --repo nodemode-dev/formCAD-binaries --draft --title "$tag" --notes-file dist/RELEASE_NOTES.md dist/*.tar.gz dist/SHA256SUMS dist/requirements.lock dist/*licence.json dist/*.cdx.json
